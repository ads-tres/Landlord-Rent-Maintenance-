; Sends SMS (receipts, reminders, repair updates) from the database queue.
[program:kiray-worker]
command=php __APP_DIR__/artisan queue:work database --sleep=3 --tries=3 --max-time=3600
directory=__APP_DIR__
user=__APP_USER__
numprocs=1
autostart=true
autorestart=true
stopwaitsecs=60
redirect_stderr=true
stdout_logfile=__APP_DIR__/storage/logs/worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
